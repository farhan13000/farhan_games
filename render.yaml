# Render Blueprint for the game server (Express + Socket.IO).
# Render → New → Blueprint → select this repo. The client is hosted on Vercel.
services:
  - type: web
    name: farhan-games-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w server
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      # MongoDB Atlas connection string (entered once in the dashboard).
      - key: MONGODB_URI
        sync: false
      # Random secrets generated by Render; never committed.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      # Your Vercel URL, e.g. https://farhan-games.vercel.app (comma-separate several).
      - key: CLIENT_ORIGIN
        sync: false
      # Requests pass through Vercel's proxy and Render's load balancer.
      - key: TRUST_PROXY
        value: '2'
      - key: COOKIE_SAMESITE
        value: lax
